server.port=8082
spring.application.name=doctor-management-service

#spring.data.mongodb.uri=mongodb+srv://dbuser:dbuser2026@test.ubtlnvl.mongodb.net/healthcare?appName=TEST
spring.data.mongodb.uri=mongodb://localhost:27017/Doctors
spring.data.mongodb.auto-index-creation=true

logging.level.org.mongodb.driver.cluster=WARN

# JWT
# Recommended: set JWT_SECRET env var in production.
jwt.secret=${JWT_SECRET:dev-secret-change-me}
# 1 day in milliseconds
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Patient Service Configuration
patient.service.url=${PATIENT_SERVICE_URL:http://localhost:8081}
