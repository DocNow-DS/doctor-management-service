apiVersion: v1
kind: ConfigMap
metadata:
  name: doctor-service-config
  labels:
    app: doctor-service
data:
  PATIENT_SERVICE_URL: "http://patient-service:8081"
  APPOINTMENT_SERVICE_URL: "http://appointment-service:8080"
  JWT_EXPIRATION_MS: "86400000"
---
apiVersion: v1
kind: Secret
metadata:
  name: doctor-service-secret
  labels:
    app: doctor-service
type: Opaque
stringData:
  SPRING_DATA_MONGODB_URI: "mongodb://mongo-service:27017/doctor_db"
  JWT_SECRET: "change-me-in-production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-service
  labels:
    app: doctor-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doctor-service
  template:
    metadata:
      labels:
        app: doctor-service
    spec:
      containers:
        - name: doctor-service
          image: doctor-management-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: doctor-service-secret
                  key: SPRING_DATA_MONGODB_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: doctor-service-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRATION_MS
              valueFrom:
                configMapKeyRef:
                  name: doctor-service-config
                  key: JWT_EXPIRATION_MS
            - name: PATIENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: doctor-service-config
                  key: PATIENT_SERVICE_URL
            - name: APPOINTMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: doctor-service-config
                  key: APPOINTMENT_SERVICE_URL
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-service
  labels:
    app: doctor-service
spec:
  selector:
    app: doctor-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
  type: ClusterIP
